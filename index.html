<script>
/* Meta Pixel - evento Lead.
   Um unico listener delegado no documento: dispara exatamente um Lead por clique
   em qualquer CTA do WhatsApp, imediatamente antes de o navegador abrir o grupo.
   Os links tem href real no HTML, entao a navegacao funciona mesmo sem este script. */
(function () {
  'use strict'
  document.addEventListener('click', function (ev) {
    var alvo = ev.target
    if (!alvo || typeof alvo.closest !== 'function') return
    if (!alvo.closest('a.wa-cta')) return
    if (typeof window.fbq === 'function') window.fbq('track', 'Lead')
  })
})()
</script>
